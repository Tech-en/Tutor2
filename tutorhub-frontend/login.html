<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TutorHub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      padding: 45px 40px;
      width: 100%;
      max-width: 440px;
    }

    .logo { font-size: 28px; font-weight: bold; color: #667eea; text-align: center; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 32px; font-size: 15px; }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      font-size: 14px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus   { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.12); }
    input.error   { border-color: #e53e3e; }

    .field-error  { display: block; color: #e53e3e; font-size: 13px; margin-top: 5px; }

    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .row-between label { margin-bottom: 0; font-weight: 400; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .row-between a { color: #667eea; text-decoration: none; }
    .row-between a:hover { text-decoration: underline; }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-submit:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider { text-align: center; color: #aaa; margin: 22px 0; font-size: 13px; position: relative; }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: #e5e5e5;
    }
    .divider::before { left: 0; } .divider::after { right: 0; }

    .footer-text { text-align: center; font-size: 14px; color: #666; margin-top: 18px; }
    .footer-text a { color: #667eea; font-weight: 600; text-decoration: none; }
    .footer-text a:hover { text-decoration: underline; }

    .back-link { display: block; text-align: center; margin-top: 14px; font-size: 13px; color: #999; text-decoration: none; }
    .back-link:hover { color: #667eea; }

    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .alert-error   { background: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }
    .alert-success { background: #f0fff4; color: #276749; border: 1px solid #c6f6d5; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">📚 TutorHub</div>
    <p class="subtitle">Welcome back! Sign in to your account.</p>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm" novalidate>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <span class="field-error" id="emailErr"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
        <span class="field-error" id="passwordErr"></span>
      </div>

      <div class="row-between">
        <label><input type="checkbox" id="rememberMe"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="submitLabel">Login</span>
        <span class="spinner" id="spinner"></span>
      </button>

    </form>

    <div class="divider">OR</div>

    <p class="footer-text">Don't have an account? <a href="register.html">Register here</a></p>
    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
  </div>

  <!-- Load modules in dependency order -->
  <script src="js/apiService.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // ── Redirect if already authenticated ───────────────────────────────────
    (function () {
      if (typeof isAuthenticated === 'function' && isAuthenticated()) {
        window.location.href = 'dashboard.html';
      }
    }());

    // ── DOM refs ─────────────────────────────────────────────────────────────
    var form       = document.getElementById('loginForm');
    var emailEl    = document.getElementById('email');
    var passwordEl = document.getElementById('password');
    var submitBtn  = document.getElementById('submitBtn');
    var submitLbl  = document.getElementById('submitLabel');
    var spinner    = document.getElementById('spinner');
    var alertBox   = document.getElementById('alertBox');

    // ── Helpers ───────────────────────────────────────────────────────────────
    function showAlert(msg, type) {
      alertBox.textContent  = msg;
      alertBox.className    = 'alert alert-' + (type || 'error');
      alertBox.style.display = 'block';
    }
    function hideAlert() { alertBox.style.display = 'none'; }

    function fieldError(id, msg) {
      var el = document.getElementById(id);
      if (msg) { el.textContent = msg; el.previousElementSibling.classList.add('error'); }
      else     { el.textContent = '';  el.previousElementSibling.classList.remove('error'); }
    }

    function setLoading(on) {
      submitBtn.disabled   = on;
      submitLbl.textContent = on ? 'Logging in…' : 'Login';
      spinner.style.display = on ? 'block' : 'none';
    }

    function clearErrors() {
      hideAlert();
      fieldError('emailErr',    '');
      fieldError('passwordErr', '');
    }

    function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

    // ── Real-time error clearing ──────────────────────────────────────────────
    emailEl.addEventListener('input',    function () { fieldError('emailErr',    ''); });
    passwordEl.addEventListener('input', function () { fieldError('passwordErr', ''); });

    // ── Form submit ───────────────────────────────────────────────────────────
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearErrors();

      var email    = emailEl.value.trim();
      var password = passwordEl.value;
      var valid    = true;

      if (!email)               { fieldError('emailErr',    'Email is required');               valid = false; }
      else if (!isValidEmail(email)) { fieldError('emailErr', 'Enter a valid email address');   valid = false; }
      if (!password)            { fieldError('passwordErr', 'Password is required');             valid = false; }
      else if (password.length < 6) { fieldError('passwordErr', 'Password must be at least 6 characters'); valid = false; }

      if (!valid) return;

      setLoading(true);

      try {
        await login(email, password);
        showAlert('Login successful! Redirecting…', 'success');
        setTimeout(function () { window.location.href = 'dashboard.html'; }, 600);
      } catch (err) {
        setLoading(false);
        showAlert(err.message || 'Login failed. Please check your credentials.', 'error');
      }
    });
  </script>
</body>
</html>
